name: Profile Stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore commit details cache
        id: commit-details-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/github-profile-stats
          key: github-profile-stats-commit-cache-v1-${{ runner.os }}-${{ hashFiles('scripts/github-profile-stats.mjs', 'src/**/*', 'config/stats.config.json') }}-${{ github.run_id }}
          restore-keys: |
            github-profile-stats-commit-cache-v1-${{ runner.os }}-${{ hashFiles('scripts/github-profile-stats.mjs', 'src/**/*', 'config/stats.config.json') }}-
            github-profile-stats-commit-cache-v1-${{ runner.os }}-

      - name: Run tests
        run: node --test

      - name: Refresh profile stats
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Hydrate commit details progressively so newly reintroduced repos warm
          # the persistent cache over several runs instead of bursting the API.
          PROFILE_STATS_HYDRATE_LIMIT: 800
        run: node scripts/github-profile-stats.mjs --write

      - name: Save warmed commit details cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/github-profile-stats
          key: github-profile-stats-commit-cache-v1-${{ runner.os }}-${{ hashFiles('scripts/github-profile-stats.mjs', 'src/**/*', 'config/stats.config.json') }}-${{ github.run_id }}

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Concurrent runs publish the same regenerated files, so a rebase would
          # just conflict. On a lost push race, fast-forward our branch pointer to
          # the latest main (keeping our fresh artifacts in the working tree) and
          # replay them on top — no merge, no conflict.
          for attempt in 1 2 3 4 5; do
            git add README.md generated
            git diff --cached --quiet && { echo "no changes to publish"; exit 0; }
            git commit -m "chore: refresh profile stats"
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), replaying artifacts onto latest ${GITHUB_REF_NAME}"
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --mixed "origin/${GITHUB_REF_NAME}"
          done
          echo "::error::failed to push after 5 attempts"
          exit 1
