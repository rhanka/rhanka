name: Profile Stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore commit details cache
        uses: actions/cache@v4
        with:
          path: .cache/github-profile-stats
          key: github-profile-stats-commit-cache-v1-${{ runner.os }}-${{ hashFiles('scripts/github-profile-stats.mjs', 'src/**/*', 'config/stats.config.json') }}
          restore-keys: |
            github-profile-stats-commit-cache-v1-${{ runner.os }}-

      - name: Run tests
        run: node --test

      - name: Refresh profile stats
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-profile-stats.mjs --write

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md generated
          git diff --cached --quiet || git commit -m "chore: refresh profile stats"
          git push
